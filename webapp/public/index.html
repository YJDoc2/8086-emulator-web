	<script>
		(function (l) {
			var params = new URLSearchParams(l.search);
			if (params.has("p")) {
				var route = params.get("p");
				var query = params.get("q");
				window.history.replaceState(
					null,
					null,
					l.pathname.replace(/\/$/, "") +
						route +
						(query ? "?" + query.replace(/~and~/g, "&") : "") +
						l.hash
				);
			} else if (l.search[1] === "/" ) {
				var decoded = l.search
					.slice(1)
					.split("&")
					.map(function (entry) {
						return entry.replace(/~and~/g, "&");
					})
					.join("?");
				window.history.replaceState(
					null,
					null,
					l.pathname.slice(0, -1) + decoded + l.hash
				);
			}
		}(window.location));
